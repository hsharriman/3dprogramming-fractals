  <script>
    // Feel free to change these numbers
    let default_params = {
      sideLength: 250, // length of one side of the largest triangle
      iterations: 2, // recursive depth
    };

    var scene = new THREE.Scene();

    var renderer = new THREE.WebGLRenderer();

    // Setting up three.js and the camera
    TW.mainInit(renderer, scene);
    let state = TW.cameraSetup(renderer, scene, {
      minx: -250,
      maxx: 0,
      miny: 0,
      maxy: 150,
      minz: 0,
      maxz: 0,
    });

    // COPY your turtle class from ex1 here!

    // WRITE your recursive fractal logic here

    const makeFractal = (params) => {
      // make the turtle line blue
      const material = new THREE.LineBasicMaterial({
        color: 0x0000ff,
      });

      const tr = new Turtle();

      // TODO: call your recursive function to draw the fractal here
      // make sure pass in tr (the turtle) to your function

      // Use list of points for each vertex to create a single line
      const geometry = new THREE.BufferGeometry().setFromPoints(tr.points);

      return new THREE.Line(geometry, material);
    };

    // add scene
    let sierp = makeSierpinski(default_params);
    scene.add(sierp);
    state.render();

    function rebuild() {
      scene.remove(sierp);
      sierp = makeSierpinski(default_params);
      scene.add(sierp);
      state.render();
    }

    // set up sliders to control the depth of the fractal
    var gui = new dat.GUI();
    gui.add(default_params, "iterations", 1, 8).onChange(rebuild);
